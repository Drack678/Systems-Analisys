<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UMOS — Urban Mobility Optimization System</title>

    <!-- Leaflet CSS (debe cargar ANTES que React) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    />

    <!-- Reset base para evitar fondo blanco -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0f1117;
        color: #e2e4f0;
        font-family: Inter, system-ui, sans-serif;
      }

      #root {
        width: 100%;
        height: 100dvh;
        display: block;
      }

      /* Evita el parpadeo blanco antes de que React monte */
      #loading {
        position: fixed;
        inset: 0;
        background: #0f1117;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        z-index: 9999;
        transition: opacity 0.3s;
      }

      #loading svg { animation: spin 1.2s linear infinite; }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }

      #loading p {
        color: #4f98a3;
        font-size: 0.9rem;
        font-weight: 600;
        letter-spacing: 0.05em;
      }
    </style>
  </head>

  <body>

    <!-- Pantalla de carga mientras React inicializa -->
    <div id="loading">
      <svg width="48" height="48" viewBox="0 0 28 28" fill="none"
           xmlns="http://www.w3.org/2000/svg">
        <circle cx="14" cy="14" r="12"
          stroke="#2e3248" stroke-width="2.5"/>
        <path d="M14 2 A12 12 0 0 1 26 14"
          stroke="#4f98a3" stroke-width="2.5"
          stroke-linecap="round"/>
      </svg>
      <p>Cargando UMOS...</p>
    </div>

    <!-- Contenedor de React -->
    <div id="root"></div>

    <!-- Script principal de Vite/React -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- Ocultar pantalla de carga cuando React monte -->
    <script>
      window.__hideSplash = function () {
        var el = document.getElementById("loading");
        if (el) {
          el.style.opacity = "0";
          setTimeout(function () { el.remove(); }, 350);
        }
      };
    </script>

  </body>
</html>
